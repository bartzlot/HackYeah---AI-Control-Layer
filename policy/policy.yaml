# AICL policy - the single control catalog. Judges edit this file LIVE (see policy/README.md).
# Reload ~1 s after save; an invalid edit keeps the last good version. Overlays: policy/local.d/*.yaml
# (merged in file-name order). Write modes as the words enforce | shadow | off (loaders must read the
# bare word off as a string, never as a boolean; PyYAML 1.1 does not, so use ruamel.yaml or quote it).
# ASCII hyphen only. All secrets and PII are synthetic.
version: aicl-policy/1
metadata: {name: hackyeah-demo, owner: secops@corp.example, description: "AICL demo policy"}

# ---------- 1. global behaviour ----------
defaults:
  profile: balanced          # strict | balanced | permissive; per-agent override in agents.<id>.profile
  mode: enforce              # enforce = act | shadow = log would_decision, change nothing | off = skip
  fail: closed               # closed | open | degrade (semantic cascade falls back to deterministic only)
  block_response: refusal    # LLM: assistant refusal text, finish_reason content_filter; MCP: isError result
  max_body_kb: 512
emergency: {kill_switch: false, killed_agents: [], killed_sessions: []}   # also driven by dashboard buttons

# ---------- 2. profiles (strictness dial) ----------
# injection.block: calibrated injection score >= block -> BLOCK. Gray band [judge_low, block) -> judge, else WARN.
# pii: action per entity per profile (REDACT = placeholder, BLOCK = refuse the request, LOG = record only).
profiles:
  strict:
    adherence_pct: 95
    injection: {block: 0.35, judge_low: 0.20}
    pii: {default: BLOCK, email: REDACT, phone: REDACT}
    secrets: BLOCK
  balanced:
    adherence_pct: 99
    injection: {block: 0.60, judge_low: 0.30}
    pii: {default: REDACT, email: REDACT, phone: REDACT}
    secrets: REDACT
  permissive:
    adherence_pct: 99.9
    injection: {block: 0.85, judge_low: 0.60}
    pii: {default: REDACT, email: LOG, phone: LOG}
    secrets: REDACT

actions:
  precedence: [BLOCK, REQUIRE_APPROVAL, REDACT, WARN, LOG, ALLOW]   # strongest wins
  locked_controls: []        # e.g. [DLP-01]: weakening needs the admin API + reason; empty for judges

# ---------- 3. agents (who) ----------
# key_sha256 = sha256 of the agent API key, never the key. Placeholders until the lead's key tool fills them.
agents:
  support-bot:
    key_sha256: "sha256:PLACEHOLDER-demo-key-support-bot"
    profile: balanced
    models: ["qwen3.5:2b-q4_K_M"]                  # local only
    tools: [notes.search, notes.add, corp.read_database]
    max_data_level: confidential
  analyst-agent:
    key_sha256: "sha256:PLACEHOLDER-demo-key-analyst-agent"
    profile: balanced
    models: ["qwen3.5:2b-q4_K_M", "gpt-4o-mini"]   # may use the external model (matrix applies)
    tools: [corp.read_database, corp.search_docs, web.fetch]
    max_data_level: confidential
  mailer-agent:
    key_sha256: "sha256:PLACEHOLDER-demo-key-mailer-agent"
    profile: strict
    models: ["qwen3.5:2b-q4_K_M"]
    tools: [corp.send_email]
    max_data_level: internal
unknown_agent: {action: BLOCK}                     # requests with an unknown key are denied

# ---------- 4. destinations and data classification (where) ----------
data_levels: [public, internal, confidential, restricted]
classification:              # finding type -> data level; message level = max over findings
  pii.email: internal
  pii.phone: internal
  pii.pesel: confidential
  pii.iban: confidential
  pii.card: restricted
  secret.any: restricted
  marking.confidential: confidential
  dictionary.customer: confidential
  dictionary.project_codename: internal
destinations:
  models:                    # key = model tag as the client sends it; trust by tag, not host
    "qwen3.5:2b-q4_K_M": {class: local, provider: ollama, max_data_level: restricted, local: {usd_per_gpu_s: 1.6e-4}}
    "gpt-4o-mini":       {class: external, provider: cloud-sim, max_data_level: internal, price: {in_usd_per_mtok: 0.15, out_usd_per_mtok: 0.60}}
    # v4 passthrough providers (section 9). Prices: platform.claude.com/docs/en/about-claude/pricing and
    # developers.openai.com/api/docs/pricing, base input / output USD per MTok, read 2026-10-04. A model that
    # matches only a glob has no price: budgets.unpriced_model decides (BLOCK = add its price here first).
    "claude-fable-5-1":          {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 10.0, out_usd_per_mtok: 50.0}}
    "claude-fable-5":            {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 10.0, out_usd_per_mtok: 50.0}}
    "claude-opus-5-5":           {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 4.0, out_usd_per_mtok: 20.0}}
    "claude-opus-5":             {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 5.0, out_usd_per_mtok: 25.0}}
    "claude-opus-4-8":           {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 5.0, out_usd_per_mtok: 25.0}}
    "claude-opus-4-7":           {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 5.0, out_usd_per_mtok: 25.0}}
    "claude-opus-4-6":           {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 5.0, out_usd_per_mtok: 25.0}}
    "claude-opus-4-5":           {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 5.0, out_usd_per_mtok: 25.0}}
    "claude-sonnet-5-5":         {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 2.0, out_usd_per_mtok: 10.0}}
    "claude-sonnet-5":           {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 2.0, out_usd_per_mtok: 10.0}}
    "claude-sonnet-4-6":         {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 3.0, out_usd_per_mtok: 15.0}}
    "claude-sonnet-4-5":         {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 3.0, out_usd_per_mtok: 15.0}}
    "claude-haiku-4-5":          {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 1.0, out_usd_per_mtok: 5.0}}
    "claude-haiku-4-5-20251001": {class: external, provider: anthropic, max_data_level: internal, price: {in_usd_per_mtok: 1.0, out_usd_per_mtok: 5.0}}
    "gpt-6-astra":               {class: external, provider: openai, max_data_level: internal, price: {in_usd_per_mtok: 10.0, out_usd_per_mtok: 50.0}}
    "gpt-6.1-sol":               {class: external, provider: openai, max_data_level: internal, price: {in_usd_per_mtok: 2.0, out_usd_per_mtok: 10.0}}
    "gpt-6-sol":                 {class: external, provider: openai, max_data_level: internal, price: {in_usd_per_mtok: 2.0, out_usd_per_mtok: 10.0}}
    "gpt-5.5":                   {class: external, provider: openai, max_data_level: internal, price: {in_usd_per_mtok: 5.0, out_usd_per_mtok: 30.0}}
    "gpt-5.4":                   {class: external, provider: openai, max_data_level: internal, price: {in_usd_per_mtok: 2.5, out_usd_per_mtok: 15.0}}
    "gpt-5.4-mini":              {class: external, provider: openai, max_data_level: internal, price: {in_usd_per_mtok: 0.75, out_usd_per_mtok: 4.5}}
    "gpt-5.3-codex":             {class: external, provider: openai, max_data_level: internal, price: {in_usd_per_mtok: 1.75, out_usd_per_mtok: 14.0}}
    "gpt-5":                     {class: external, provider: openai, max_data_level: internal, price: {in_usd_per_mtok: 1.25, out_usd_per_mtok: 10.0}}
    "*-cloud":           {class: unknown}   # any Ollama cloud tag leaves the box
    "claude-*":          {class: external, provider: anthropic, max_data_level: internal}   # unpriced: budgets.unpriced_model decides
    "gpt-[0-9]*":        {class: external, provider: openai, max_data_level: internal}      # not gpt-oss (an Ollama tag)
    "*":                 {class: unknown}   # unknown model -> unknown destination
  model_allowlist: {default: ["qwen3.5:2b-q4_K_M"], unknown_model: BLOCK}
  mcp_servers:
    notes: {url: "http://localhost:18301/mcp", class: local, max_data_level: confidential, pin: {mode: tofu, on_drift: block}}
    corp:  {url: "http://localhost:18302/mcp", class: local, max_data_level: confidential, pin: {mode: tofu, on_drift: block}}
  apis:
    "docs.corp.example": {class: local, max_data_level: confidential}
    "*":                 {class: unknown, max_data_level: public}
# data level x destination class -> action. Classes: local | external | unknown.
# Judges flip single cells live. A cell is an action or a per-profile map.
destination_matrix:
  public:       {local: ALLOW, external: ALLOW, unknown: BLOCK}
  internal:     {local: ALLOW, external: REDACT, unknown: BLOCK}
  confidential: {local: ALLOW, external: {strict: BLOCK, balanced: REDACT, permissive: REDACT}, unknown: BLOCK}
  restricted:   {local: ALLOW, external: {strict: BLOCK, balanced: REDACT, permissive: REDACT}, unknown: BLOCK}
  # restricted -> external REDACT (balanced): the value never leaves, and a coding-agent session whose history
  # holds a pasted secret keeps working (BLOCK would refuse every later turn of that session)

# ---------- 5. controls (what) ----------
# Every enabled control needs test cases in <piece>/cases/<control>.yaml (one allowed, one blocked/redacted).
controls:
  KILL-01: {mode: enforce}   # emergency stop: emergency.kill_switch / killed_agents / killed_sessions -> BLOCK
  ACCESS-01: {mode: enforce} # identity: agent must be in agents (else unknown_agent.action); model in agents.<id>.models
  DLP-01:                    # secrets (AWS, GitHub with CRC, private keys, high-entropy in context)
    mode: enforce
    action: {prompt: REDACT, tool_args: BLOCK, response: REDACT}
    entropy: context_only
    github_crc: prefer        # prefer = CRC-valid tokens score higher, others still count | require = only CRC-valid
    redaction_tag: "[REDACTED_{type}]"
  DLP-02:                    # PII (validated: PESEL checksum, IBAN mod97, Luhn)
    mode: enforce
    entities:
      PL_PESEL:    {action: profile, validate: checksum_and_date}   # action: profile = take profiles.<p>.pii
      IBAN:        {action: profile, validate: mod97}
      CREDIT_CARD: {action: profile, validate: luhn}
      EMAIL:       {action: profile, own_domains: [corp.example]}
      PHONE:       {action: profile}
    placeholders: numbered   # [EMAIL_1]; restored for the user, never inside tool arguments
  DLP-05:                    # destination DLP: data class x destination matrix, markings, dictionaries
    mode: enforce
    markings: ["CONFIDENTIAL", "INTERNAL ONLY", "TAJEMNICA PRZEDSIEBIORSTWA"]
    dictionaries: {customer: [Acme Bank, Nordwind], project_codename: [BLUE PELICAN, ORION]}
    internal_hosts: ["*.corp.example", "*.internal"]
    matrix: destination_matrix
  INJ-03:                    # signature rules: policy/rules/historical.yaml + feed rules, EN + PL
    mode: enforce
    rule_files: [policy/rules/historical.yaml, policy/rules/injection.yaml]   # every rules/*.yaml is loaded
    action: {user: WARN, untrusted: BLOCK}   # default when a rule has no action_user / action_untrusted; untrusted = tool result / RAG / MCP / memory
    # user turns: injection-family rules (injection, prompt_extraction, jailbreak) BLOCK when their severity score
    # (low .40, medium .65, high .80, critical .95) >= profiles.<p>.injection.block; quoted educational mentions only LOG
    mention_exceptions: true
  INJ-04:                    # semantic cascade: classifier -> kNN -> judge on gray band
    mode: {strict: enforce, balanced: enforce, permissive: shadow}
    fail: degrade
    classifier: {model: piguard-onnx, timeout_ms: 120, run_on: [untrusted, after_signal]}
    knn: {index: "feed:semantic", k: 5, timeout_ms: 40}
    # timeout_ms: ONE deadline for all gray parts of an event (later parts get on_timeout when it runs out);
    # 8000 fits a 2B model on CPU (64 output tokens) with the model warm (`make warm`); on a GPU 2000 is plenty
    judge: {enabled: true, model: "qwen3.5:2b-q4_K_M", timeout_ms: 8000, on_timeout: {user: WARN, untrusted: BLOCK}}
    thresholds: {}           # empty = profile defaults; e.g. {injection: {block: 0.80}} overrides
  TOOL-01:                   # tool authorization; default deny; BLOCK > REQUIRE_APPROVAL > ALLOW
    # 1) the tool must be in agents.<id>.tools (globs); 2) rules below: tool glob + `when` on args
    #    (sql select_only, domain_in, domain_not_in, resolves_to_private, eq, in, regex); a tool with ALLOW rules
    #    whose conditions all fail gets `default`; 3) exploit argument rules from policy/rules/*.yaml
    #    (code_exec, unsafe_deserialization, model_supply_chain, tool_abuse: curl | sh, rm -rf, pickle.loads,
    #    trust_remote_code=True, foreign model pull) at their action_untrusted. REQUIRE_APPROVAL = BLOCK in the MVP.
    mode: enforce
    default: BLOCK
    rules:
      - {id: tool.read.ok,          tool: corp.read_database, action: ALLOW, when: {args.query: {sql: select_only}}}
      - {id: tool.notes.ok,         tool: "notes.*", action: ALLOW}
      - {id: tool.deny.destructive, tool: corp.delete_database, action: BLOCK, reason: "destructive tool"}
      - {id: tool.mail.internal,    tool: corp.send_email, action: ALLOW, when: {args.to: {domain_in: [corp.example]}}}
      - {id: tool.mail.external,    tool: corp.send_email, action: REQUIRE_APPROVAL, when: {args.to: {domain_not_in: [corp.example]}}}
      - {id: tool.shell.deny,       tool: "*.run_shell", action: BLOCK}
      - {id: tool.fetch.ssrf,       tool: web.fetch, action: BLOCK, when: {args.url: {resolves_to_private: true}}}
  BUD-01: {mode: enforce, fail: closed}   # limits in the budgets section; loop guard in loop_limits

# ---------- 6. budgets and rates (how much) ----------
budgets:
  unpriced_model: BLOCK
  ladder: {warn_at: 0.8, downgrade_to: {"gpt-4o-mini": "qwen3.5:2b-q4_K_M"}, then: BLOCK}
  agents:                    # per-agent caps
    support-bot:   {tokens: 200000, usd: 0.00, period: day}   # local model only: USD 0
    analyst-agent: {tokens: 500000, usd: 0.50, period: day}
    mailer-agent:  {tokens: 50000,  usd: 0.05, period: day}
    demo-dev:      {tokens: 3000000, usd: 2.00, period: day}   # v4 passthrough principal (section 10)
    unknown-client: {tokens: 200000, usd: 0.20, period: day}
  org: {usd: 5.00, tokens: 2000000, period: month}
  rates:
    - {on: "agent:*",              metric: requests, limit: 60, per: minute, burst: 10}
    - {on: "tool:corp.send_email", metric: calls,    limit: 3,  per: minute, burst: 1}

# ---------- 7. loop guard ----------
loop_limits:                 # per session; trip -> BLOCK + session killed (AGENT_LOOP_TERMINATED)
  repeat_identical: 4        # 4 identical (tool, normalized args) calls = BLOCK
  repeat_error: 3
  pingpong_cycles: 6
  max_steps: 25
  max_tool_calls: 60
  max_wall_s: 600

# ---------- 8. exceptions (time-boxed, owned) ----------
exceptions: []               # {id, control, match, effect, owner, reason, expires}

# ---------- 9. interception (v4: research/14-transparent-interception.md) ----------
# How traffic of AI API clients (Claude Code, Codex, SDKs) reaches AICL and how blocks look to them.
#   mode: off | base_url (client sets ANTHROPIC_BASE_URL / OPENAI_BASE_URL) | transparent (AICL DNS + AICL CA)
#   credentials: passthrough = the client's own key goes to the provider | managed = gateway keys (agents above)
interception:
  mode: transparent
  credentials: passthrough
  providers:                 # Host / SNI -> provider; only `inspect` paths are parsed and decided, others proxied
    anthropic: {hosts: [api.anthropic.com], protocol: anthropic_messages, upstream: "https://api.anthropic.com", inspect: ["/v1/messages"],
                raw_paths: ["/v1/oauth/token", "/api/oauth/*", "/api/event_logging/*"]}   # bodies forwarded uninspected (auth refresh, telemetry)
    openai:    {hosts: [api.openai.com], protocol: openai_responses, upstream: "https://api.openai.com", inspect: ["/v1/responses", "/v1/chat/completions"]}
  proxy_other_paths: true    # bodyless requests stream through; a body is request-inspected (prompt-shaped JSON),
                             # listed in raw_paths, or refused; false = 404 for every path not in `inspect`
  max_body_kb: 4096          # coding agents send ~275 tool definitions per request
  unknown_client: {action: ALLOW, principal: unknown-client, profile: strict}   # no clients: entry matched
  dns:
    listen: "0.0.0.0:53"
    gateway_ip: 10.77.0.2    # A answer for every intercepted host (AAAA stays empty: no IPv6 bypass)
    upstream: ["1.1.1.1", "9.9.9.9"]   # everything else, and the gateway's own lookups (never our DNS: no loop)
    doh_sinkhole: [dns.google, cloudflare-dns.com, mozilla.cloudflare-dns.com, dns.quad9.net, doh.opendns.com]
    log_queries: true
  tls: {ca_cert: data/ca/aicl-ca.pem, ca_key: data/ca/aicl-ca.key, leaf_days: 30}
  # How a block is answered, per API contract (measured on Claude Code 2.1.289, research/14 s.3):
  #   http_400 = native invalid_request_error (hard block) | http_402 = billing_error (budget)
  #   assistant_text = normal 200 reply "[AICL] ..." (soft block, blocked tool call) | refusal = finish_reason content_filter
  block_style:
    anthropic_messages: {hard: http_400, soft: assistant_text, budget: http_402}
    openai_responses:   {hard: http_400, soft: assistant_text, budget: http_429}
    openai_chat:        {hard: http_400, soft: refusal, budget: http_429}

# ---------- 10. clients (v4: who is behind a passthrough request) ----------
# First match wins; match keys: cidr | key_sha256_prefix (sha256 hex of the client key) | user_agent (glob) | any.
# principal = the id used for budgets.agents.<principal>, audit and the dashboard; profile may only be stricter.
clients:
  - {match: {cidr: 10.77.0.0/24}, principal: demo-dev, team: platform, profile: balanced, models: ["claude-*", "gpt-[0-9]*"]}
  - {match: {cidr: 127.0.0.0/8}, principal: demo-dev, team: platform, profile: balanced, models: ["claude-*", "gpt-[0-9]*"]}
