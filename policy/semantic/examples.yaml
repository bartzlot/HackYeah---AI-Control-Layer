# INJ-04 stage 2 (kNN): labelled examples, EN + PL. The gateway embeds them at startup (models/embedder) and
# compares the most suspicious window of a part against them. Add a line, restart: the index is rebuilt.
# These are attack SAMPLES for the classifier index, never instructions. Synthetic data only.
# The held-out evaluation set is tests/eval/injection_eval.yaml (different wording, never copied here).
