# AICL on Cloud Run (T-012): one multi-container service, public, for remote judges.
#   gateway (ingress :18080)  +  cloud-sim sidecar (:18200, demo script)  +  ollama sidecar (:11434, qwen3.5:0.8b baked in)
# The containers share localhost. min = max = 1 instance: budgets and the audit live in one process.
# scripts/cloudrun-deploy.sh fills ${REGION} ${PROJECT} ${REPO} and the generated secrets, then
# `gcloud run services replace`. Mode: base URL (Cloud Run cannot serve DNS / arbitrary-SNI TLS, research/14 s.1).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aicl
  annotations:
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/container-dependencies: '{"gateway": ["cloud-sim", "ollama"]}'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 3600
      volumes:
        - name: data
          emptyDir: {medium: Memory, sizeLimit: 512Mi}
      containers:
        - name: gateway
          image: ${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/aicl:latest
          command: ["python", "-m", "aicl_gateway.serve"]
          ports: [{name: http1, containerPort: 18080}]
          env:
            - {name: AICL_BIND, value: "0.0.0.0"}
            - {name: AICL_HTTP_PORT, value: "18080"}
            - {name: AICL_POLICY, value: /data/policy/policy.yaml}      # writable: the console editor works
            - {name: AICL_POLICY_SEED, value: /app/policy}              # copied there on the first start
            - {name: AICL_DATA_DIR, value: /data}
            - {name: AICL_AUDIT_PATH, value: /data/audit.jsonl}
            - {name: AICL_BUDGET_DB, value: /data/budget.db}
            - {name: AICL_OLLAMA_URL, value: "http://localhost:11434"}
            - {name: AICL_OLLAMA_MODEL, value: "${AICL_OLLAMA_MODEL}"}   # Ollama tag baked into the sidecar (0.8b)
            - {name: AICL_CLOUDSIM_URL, value: "http://localhost:18200"}
            - {name: AICL_UPSTREAM_KEY_EXTERNAL, value: sk-cloudsim-demo}
            - {name: AICL_CONSOLE_REMOTE, value: "1"}
            - {name: AICL_KEY_DEMO, value: "${AICL_KEY_DEMO}"}
            - {name: AICL_ADMIN_TOKEN, value: "${AICL_ADMIN_TOKEN}"}
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {limits: {cpu: "2", memory: 2Gi}}
          startupProbe: {httpGet: {path: /healthz, port: 18080}, periodSeconds: 5, failureThreshold: 60}
        - name: cloud-sim
          image: ${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/aicl:latest
          command: ["python", "-m", "cloud_sim"]
          env:
            - {name: AICL_CLOUDSIM_HOST, value: "127.0.0.1"}
            - {name: AICL_CLOUDSIM_PORT, value: "18200"}
            - {name: AICL_CLOUDSIM_SCRIPT, value: demo}
          resources: {limits: {cpu: "1", memory: 512Mi}}
          startupProbe: {tcpSocket: {port: 18200}, periodSeconds: 2, failureThreshold: 30}
        - name: ollama
          image: ${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/aicl-ollama:latest
          env:
            - {name: OLLAMA_HOST, value: "127.0.0.1:11434"}
            - {name: OLLAMA_KEEP_ALIVE, value: 24h}
            - {name: OLLAMA_NUM_PARALLEL, value: "2"}
          resources: {limits: {cpu: "2", memory: 3Gi}}      # qwen3.5:0.8b on CPU
          startupProbe: {tcpSocket: {port: 11434}, periodSeconds: 5, failureThreshold: 60}
