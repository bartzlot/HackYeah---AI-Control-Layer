# AICL reference egress policy for a Linux router / VPC gateway (research/14 s.1). Not applied by AICL itself:
# the network team owns the firewall, exactly like DHCP. With it, every bypass in the table of research/14 s.1
# fails closed instead of leaking. Adapt the sets; addresses below are documentation examples.
#   nft -f deploy/firewall/nftables-aicl.conf
table inet aicl_egress {
  set aicl_gateway  { type ipv4_addr; elements = { 10.77.0.2 } }          # the AICL gateway / resolver
  set ai_providers4 { type ipv4_addr; flags interval; elements = { 160.79.104.0/23 } }   # provider API ranges (verify with each provider)
  set ai_providers6 { type ipv6_addr; flags interval; elements = { 2607:6bc0::/48 } }

  chain forward {
    type filter hook forward priority 0; policy accept;

    # 1. DNS only to the AICL resolver (other resolvers, DNS-over-TLS)
    ip saddr != @aicl_gateway udp dport 53 ip daddr != @aicl_gateway drop
    ip saddr != @aicl_gateway tcp dport 53 ip daddr != @aicl_gateway drop
    tcp dport 853 drop
    udp dport 853 drop

    # 2. AI provider APIs only from the gateway (hard-coded IPs, a changed ANTHROPIC_BASE_URL to the real host)
    ip saddr != @aicl_gateway ip daddr @ai_providers4 tcp dport 443 counter drop
    ip6 daddr @ai_providers6 tcp dport 443 counter drop
    # QUIC to the providers (HTTP/3) is never needed by API clients
    ip daddr @ai_providers4 udp dport 443 drop

    # 3. Providers on shared CDN addresses (no stable range): default-deny workstation egress and allow only
    #    through the corporate proxy / AICL, or rely on SNI filtering on the proxy (not shown here).
  }
}
