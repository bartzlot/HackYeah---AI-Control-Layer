# Requirements traceability: every requirement of the CRIETRIA PDF (research/brief.md) -> the tests that prove it.
# Evidence forms:  path::test_function  (pytest, parametrized ids included)  |  case:CONTROL:ID  (case file)
# kind: pos = allowed / works, neg = blocked / redacted / rejected, live = real CLI or browser (make live*).
# tests/test_requirements_matrix.py checks every reference exists and that control requirements have pos + neg;
# scripts/verify.py (make verify) runs the suites and writes reports/requirements_report.md.
