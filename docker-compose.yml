# AICL demo stack: gateway :18080 (+ console /console), cloud-sim :18200 (priced mock), ollama :11434 (CPU).
# Everything binds to 127.0.0.1 by default. Inside the container the console sees the docker bridge, not
# loopback, so AICL_CONSOLE_REMOTE=1 is set here and the host-only guarantee comes from the port mapping.
# Remote access: ssh tunnel (gcloud compute ssh VM -- -L 18080:localhost:18080), or AICL_GATEWAY_BIND=0.0.0.0
# ONLY with the VM firewall limited to the demo IP (that also exposes the console and its demo key).
# Gateway and cloud-sim share one image (w1-gateway/Dockerfile). Model pull is opt-in: `make models`.
# Deploy to the GCP VM is `make deploy` (T-902).
name: aicl

x-aicl: &aicl
  build: {context: ., dockerfile: w1-gateway/Dockerfile}
  image: aicl:local
  restart: unless-stopped

services:
  gateway:
    <<: *aicl
    ports: ["${AICL_GATEWAY_BIND:-127.0.0.1}:${AICL_GATEWAY_PORT:-18080}:18080"]
    env_file: [{path: .env, required: false}]
    environment:   # wins over .env: container paths and service names
      AICL_CONSOLE_REMOTE: "1"
      AICL_POLICY: /app/policy/policy.yaml
      AICL_OLLAMA_URL: http://ollama:11434
      AICL_CLOUDSIM_URL: http://cloud-sim:18200
      # demo agent + playground key: .env wins; without a .env the public example key keeps the stack usable
      # (host-only port by default; main.py warns when the example key is used on a non-loopback bind)
      AICL_KEY_DEMO: ${AICL_KEY_DEMO:-aicl_demo_0123456789abcdef}
      # console edits from the browser (the bridge address is not loopback) need this token; set it in .env
      AICL_ADMIN_TOKEN: ${AICL_ADMIN_TOKEN:-}
      AICL_DATA_DIR: /app/data
      AICL_AUDIT_PATH: /app/data/audit.jsonl
      AICL_BUDGET_DB: /app/data/budget.db
    volumes:
      - ./policy:/app/policy        # edit on the host or from the console; the gateway polls and reloads
      - ./models:/app/models:ro     # INJ-04 classifier + kNN embedder (make models-onnx); empty = judge-only cascade
      - gateway-data:/app/data      # audit JSONL + budget SQLite survive restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:18080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      cloud-sim: {condition: service_healthy}
      ollama: {condition: service_started}   # a missing model degrades, it does not block startup

  cloud-sim:
    <<: *aicl
    command: ["python", "-m", "cloud_sim"]
    environment:
      # built-in repeatable demo script: the "commercial" model asks for a `curl ... | bash` tool call so demo
      # scenario S6 (tool call blocked) is visible; empty = plain echo replies
      AICL_CLOUDSIM_SCRIPT: ${AICL_CLOUDSIM_SCRIPT:-demo}
    ports: ["127.0.0.1:18200:18200"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:18200/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama-models:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 24h   # keep the model loaded once `make warm` loaded it (a cold load eats the judge deadline)
      OLLAMA_NUM_PARALLEL: 2   # the judge must not queue behind a long local answer
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # one-shot: `docker compose --profile models run --rm ollama-pull` (make models)
  ollama-pull:
    image: ollama/ollama:latest
    profiles: [models]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["${AICL_OLLAMA_MODEL:-qwen3.5:2b-q4_K_M}"]
    depends_on:
      ollama: {condition: service_healthy}

volumes:
  gateway-data:
  ollama-models:
