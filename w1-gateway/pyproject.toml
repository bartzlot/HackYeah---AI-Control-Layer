[project]
name = "aicl-gateway"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["aicl-contracts", "aicl-core", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "orjson>=3.10", "pyyaml>=6", "dnslib>=0.9.24", "cryptography>=43", "ruamel.yaml>=0.18", "onnxruntime>=1.20", "tokenizers>=0.20", "numpy>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aicl_gateway", "cloud_sim"]
