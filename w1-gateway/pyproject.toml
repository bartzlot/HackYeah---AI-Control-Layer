[project]
name = "aicl-gateway"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["aicl-contracts", "aicl-core", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "orjson>=3.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aicl_gateway"]
